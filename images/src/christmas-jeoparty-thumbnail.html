<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#123A2B;--red:#9E1C26;--red2:#C02B36;--gold:#D9AE4E;--gold2:#F4D88A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:Poppins,sans-serif}
#thumb{width:2000px;height:1500px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#25634A 0%,#174A37 45%,#0C2A1F 100%)}
#thumb:before{content:"";position:absolute;inset:22px;border:6px solid var(--gold);border-radius:10px}
.snow{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(244,216,138,.35) 2px,transparent 3px);background-size:120px 120px}
.top{position:absolute;left:0;right:0;top:50px;text-align:center}
h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1;letter-spacing:2px}
h1 .a{display:block;font-size:118px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25)}
h1 .b{display:block;font-size:112px;color:var(--gold2);margin-top:6px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.sub{margin-top:18px;font-weight:800;font-size:44px;color:#fff;letter-spacing:2px}
.sub i{font-style:normal;color:var(--gold2);margin:0 14px}
/* tv */
.tv{position:absolute;left:90px;top:405px;width:1820px;background:#0D1210;border-radius:26px;padding:22px;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.scr{background:linear-gradient(180deg,#14452F,#0E3423);border:5px solid var(--gold);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{background:linear-gradient(180deg,var(--red2),var(--red));border:3px solid var(--gold);border-radius:10px;height:118px;display:grid;place-items:center;text-align:center;color:#fff;font-weight:800;font-size:30px;line-height:1.1;padding:0 8px}
.v{background:#0B2A1C;border:3px solid #6F8E3E;border-radius:10px;height:94px;display:grid;place-items:center;color:var(--gold2);font-weight:900;font-size:58px}
.v.used{color:transparent;background:#0A2218;border-color:#2E4A33}
.btns{display:flex;justify-content:center;gap:24px;margin-top:20px}
.btns span{border:3px solid var(--gold);color:#fff;font-weight:800;font-size:28px;padding:8px 34px;border-radius:999px}
.btns .on{background:var(--gold);color:#123A2B}
.stand{position:absolute;left:50%;transform:translateX(-50%);top:1218px;width:240px;height:30px;background:#0D1210;border-radius:0 0 14px 14px}
.pills{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:30px}
.pills span{font-weight:900;font-size:54px;padding:14px 56px;border-radius:999px;border:5px solid var(--gold)}
</style></head><body>
<div id="thumb">
  <div class="snow"></div>
  <div class="top">
    <h1><span class="a">CHRISTMAS JEOPARTY</span><span class="b">TRIVIA GAME</span></h1>
    <div class="sub">POWERPOINT<i>•</i>GOOGLE SLIDES<i>•</i>CANVA<i>•</i>PRINTABLE</div>
  </div>
  <div class="tv"><div class="scr">
    <div class="grid" id="g">
      <div class="cat">Christmas<br>Movies</div><div class="cat">Santa &amp; His<br>Reindeer</div><div class="cat">Around the<br>World</div><div class="cat">Holiday<br>Treats</div><div class="cat">Carols &amp;<br>Classics</div><div class="cat">Traditions<br>&amp; Trivia</div>
    </div>
    <div class="btns"><span>SCORES</span><span>HOW TO PLAY</span><span class="on">FINAL ROUND</span></div>
  </div></div>
  <div class="stand"></div>
  <div class="pills">
    <span style="background:var(--red);color:#fff">100% EDITABLE</span>
    <span style="background:linear-gradient(135deg,var(--gold2),var(--gold));color:#123A2B">INSTANT DOWNLOAD</span>
  </div>
</div>
<script>
const g=document.getElementById('g');
for(const v of [100,200,300,400,500]) for(let c=0;c<6;c++){const d=document.createElement('div');d.className='v';d.textContent='$'+v;g.appendChild(d);}
</script>
</body></html>
