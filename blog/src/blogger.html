<!-- HEYFINORA blog post: paste into Blogger's HTML view. Title, Search Description and Labels go in Blogger's own fields. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json">
{{schema}}
</script>
<style>
.hf-post{--hf-ink:#1F1B2E;--hf-muted:#6B6478;--hf-plum:#5B3E8C;--hf-plum2:#7A5BB0;--hf-lilac:#ECE4F7;--hf-gold:#C9A55A;--hf-line:#E4DCEE;color:var(--hf-ink);font:400 17px/1.75 Inter,system-ui,sans-serif}
.hf-post h2,.hf-post h3{font-family:'Playfair Display',Georgia,serif;line-height:1.25;color:var(--hf-ink)}
.hf-post h2{font-size:28px;margin:44px 0 12px}
.hf-post h3{font-size:21px;margin:28px 0 8px}
.hf-post a{color:var(--hf-plum);text-underline-offset:3px}
.hf-post ul,.hf-post ol{padding-left:22px}
.hf-post li{margin:4px 0}
.hf-post img{display:block;width:100%;height:auto;border-radius:14px;margin:24px 0;box-shadow:0 10px 30px rgba(20,20,50,.15)}
.hf-post .hf-table{overflow-x:auto;margin:20px 0}
.hf-post table{border-collapse:collapse;width:100%;font-size:15px}
.hf-post th{background:var(--hf-plum);color:#fff;text-align:left;font-weight:600}
.hf-post th,.hf-post td{padding:12px 14px;border-bottom:1px solid var(--hf-line)}
.hf-post tbody tr:nth-child(even){background:var(--hf-lilac)}
.hf-post em{color:var(--hf-muted)}
.hf-post .hf-toc{background:var(--hf-lilac);border-radius:14px;padding:18px 22px;margin:24px 0}
.hf-post .hf-toc p{margin:0 0 6px;font-weight:700;color:var(--hf-plum);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.hf-post .hf-toc ol{margin:0}
.hf-post .hf-toc a{text-decoration:none}
.hf-post #a-complete-excel-and-printable-debt-payoff-system{border-top:3px solid var(--hf-gold);padding-top:24px}
.hf-post a[href*="etsy.com"]{display:inline-block;background:var(--hf-plum);color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;margin:8px 0}
.hf-post a[href*="etsy.com"]:hover{background:var(--hf-plum2)}
</style>
<div class="hf-post">
{{intro}}
<div class="hf-toc"><p>In this guide</p><ol>{{toc}}</ol></div>
{{rest}}
</div>
