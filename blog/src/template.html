<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | HEYFINORA</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json">
{{schema}}
</script>
<style>
:root{--bg:#F6F1EA;--card:#fff;--ink:#1F1B2E;--muted:#6B6478;--plum:#5B3E8C;--plum2:#7A5BB0;--lilac:#ECE4F7;--gold:#C9A55A;--line:#E4DCEE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141F;--card:#211C2C;--ink:#EEE9F5;--muted:#A9A1B8;--plum:#B79BE6;--plum2:#C9B3F0;--lilac:#2D2540;--gold:#D8B970;--line:#352D47}}
:root[data-theme="dark"]{--bg:#17141F;--card:#211C2C;--ink:#EEE9F5;--muted:#A9A1B8;--plum:#B79BE6;--plum2:#C9B3F0;--lilac:#2D2540;--gold:#D8B970;--line:#352D47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.75 Inter,system-ui,sans-serif}
header.site{border-bottom:1px solid var(--line);padding:18px 16px;text-align:center}
.brand{font-weight:700;letter-spacing:.35em;color:var(--plum);font-size:15px}
.hero{max-width:820px;margin:0 auto;padding:56px 16px 24px;text-align:center}
.eyebrow{display:inline-block;background:var(--lilac);color:var(--plum);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.25;color:var(--ink)}
h1{font-size:clamp(30px,5vw,46px);margin:18px 0 12px}
.lede{color:var(--muted);font-size:18px;margin:0}
.layout{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px}
nav.toc{position:sticky;top:20px;align-self:start;font-size:14px;line-height:1.5}
nav.toc p{font-weight:700;color:var(--plum);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
nav.toc li a{display:block;padding:6px 12px;color:var(--muted);text-decoration:none}
nav.toc li a:hover{color:var(--plum)}
article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,52px);min-width:0}
article h2{font-size:28px;margin:48px 0 12px;padding-top:8px}
article h2:first-of-type{margin-top:8px}
article h3{font-size:21px;margin:30px 0 8px}
article a{color:var(--plum);text-underline-offset:3px}
article strong{color:var(--ink)}
article ul,article ol{padding-left:22px}
article li{margin:4px 0}
article li::marker{color:var(--plum2)}
.table-wrap{overflow-x:auto;margin:20px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--plum);color:#fff;text-align:left;font-weight:600}
:root[data-theme="dark"] th{color:#17141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) th{color:#17141F}}
th,td{padding:12px 14px;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--lilac)}
td[style*="right"],th[style*="right"]{font-variant-numeric:tabular-nums}
em{color:var(--muted)}
#a-complete-excel-and-printable-debt-payoff-system{background:var(--lilac);margin-left:calc(-1*clamp(20px,5vw,52px));margin-right:calc(-1*clamp(20px,5vw,52px));padding:28px clamp(20px,5vw,52px) 8px;border-top:3px solid var(--gold)}
article a[href*="etsy.com"]{display:inline-block;background:var(--plum);color:var(--card);text-decoration:none;padding:14px 26px;border-radius:999px;margin:8px 0}
article a[href*="etsy.com"]:hover{background:var(--plum2)}
article img{display:block;width:100%;height:auto;border-radius:14px;margin:24px 0;box-shadow:0 10px 30px rgba(20,20,50,.15)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:40px 16px}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav.toc{position:static;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}}
</style>
</head>
<body>
<header class="site"><span class="brand">HEYFINORA</span></header>
<section class="hero">
  <span class="eyebrow">Debt Payoff Guide</span>
  <h1>{{title}}</h1>
  <p class="lede">{{description}}</p>
</section>
<div class="layout">
  <nav class="toc" aria-label="Contents"><p>In this guide</p><ol>{{toc}}</ol></nav>
  <article>
{{body}}
  </article>
</div>
<footer>&copy; HEYFINORA &middot; Plan clearly. Track consistently. Make progress toward zero.</footer>
<script>document.querySelectorAll('article table').forEach(t=>{const w=document.createElement('div');w.className='table-wrap';t.before(w);w.append(t)});</script>
</body>
</html>
